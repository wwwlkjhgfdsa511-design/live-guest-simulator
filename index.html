<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000">
<title>TikTok LIVE Guest</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{display:grid;place-items:center}
#stage{position:relative;width:1125px;height:1125px;overflow:hidden}
#hostMedia{position:absolute;left:15px;top:20px;width:604px;height:1025px;overflow:hidden;border-radius:27px;z-index:0;background:#000}
#hostMedia img,#hostMedia video{width:100%;height:100%;object-fit:cover;display:block}
#frame{position:absolute;inset:0;width:1125px;height:1125px;z-index:1}
#slots{position:absolute;inset:0;z-index:5;pointer-events:none}
.slot{position:absolute;display:none;overflow:hidden}
.slot.active{display:block}
.s1{left:631px;top:20px;width:241px;height:248px}.s2{left:879px;top:20px;width:226px;height:248px}
.s3{left:631px;top:279px;width:241px;height:248px}.s4{left:879px;top:279px;width:226px;height:248px}
.s5{left:631px;top:538px;width:241px;height:248px}.s6{left:879px;top:538px;width:226px;height:248px}
.s7{left:631px;top:797px;width:241px;height:248px}.s8{left:879px;top:797px;width:226px;height:248px}
.card{position:absolute;inset:0;background:url('/guest_template_exact_reference.png') 0 0/100% 100% no-repeat}
.avatar{position:absolute;z-index:4;left:50%;top:49%;width:55%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;object-fit:cover;border:1.6px solid rgba(255,255,255,.88)}
.score{position:absolute;z-index:6;left:34%;top:10.5%;color:#fff;font:400 22px Arial,sans-serif;direction:ltr;white-space:nowrap}
.name{position:absolute;z-index:6;left:6.8%;top:75%;width:48%;height:12%;color:#fff;font:400 21px Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:left}
@media (max-width:1125px),(max-height:1125px){#stage{transform:scale(min(100vw/1125,100vh/1125))}}
</style>
</head>
<body>
<div id="stage">
<div id="hostMedia" aria-hidden="true"></div>
<img id="frame" src="/frame_host_media.png" alt="">
<div id="slots"></div>
</div>
<script>
const DURATION=135000,MAX_SCORE=499900;
function fmt(v){v=Math.max(0,Math.min(MAX_SCORE,Number(v)||0));return v>=1000?(v/1000).toFixed(1).replace(/\.0$/,'')+'K':Math.floor(v).toString()}
function safe(u){return u?String(u).replaceAll('"','%22'):''}
function makeGuest(s){
 const el=document.createElement('div');el.className='slot s'+s.slot+' active';
 el.innerHTML=`<div class="card"><img class="avatar" src="${safe(s.avatar||'')}" alt=""><span class="score">0</span><span class="name"></span></div>`;
 el.querySelector('.name').textContent=s.username||'';
 return el;
}
function render(data){
 const root=document.getElementById('slots');root.replaceChildren();
 for(const s of (Array.isArray(data.slots)?data.slots:[])){
  if(!s||!s.active)continue;
  const n=makeGuest(s);root.appendChild(n);const start=Number(s.started_at)||Date.now();
  const tick=()=>{if(!n.isConnected)return;const p=Math.min(1,Math.max(0,(Date.now()-start)/DURATION));n.querySelector('.score').textContent=fmt(MAX_SCORE*p);requestAnimationFrame(tick)};requestAnimationFrame(tick);
 }
}
let hostUrl="";
async function refreshHostMedia(){
 try{const r=await fetch('/host-media-state?'+Date.now(),{cache:'no-store'}),s=await r.json(),root=document.getElementById('hostMedia');
 if(!s.active){if(hostUrl){root.replaceChildren();hostUrl=''};return}
 if(hostUrl===s.url)return;hostUrl=s.url;root.replaceChildren();
 if(String(s.type).startsWith('video/')){const v=document.createElement('video');v.src=s.url;v.autoplay=true;v.loop=true;v.muted=true;v.playsInline=true;root.appendChild(v);v.play().catch(()=>{})}
 else{const i=document.createElement('img');i.src=s.url;root.appendChild(i)}
 }catch(e){}
}
async function refresh(){try{const r=await fetch('/state?'+Date.now(),{cache:'no-store'});if(r.ok)render(await r.json())}catch(e){}}
refresh();refreshHostMedia();setInterval(refresh,350);setInterval(refreshHostMedia,1000);
</script>
</body>
</html>
